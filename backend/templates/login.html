{% extends "base.html" %}
{% block title %}Log in &mdash; {{ site_name }}{% endblock %}

{% block content %}
<div class="page__head">
  <div>
    <h1>Log in</h1>
    <p>For growers, landowners, farmers and the people funding a season.</p>
  </div>
</div>

<form class="form-narrow" method="post" action="/login">
  <input type="hidden" name="next" value="{{ next or '' }}">
  {% if error %}<p class="flash flash--bad" role="alert">{{ error }}</p>{% endif %}

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" required>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
  </div>

  <div class="form-actions">
    <button class="btn btn--solid" type="submit">Log in</button>
    <span class="help">No account? <a href="/signup{% if next %}?next={{ next }}{% endif %}">Make one</a>.</span>
  </div>
</form>
{% endblock %}
